<!DOCTYPE html>

<html lang="ko">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>[속보] 오늘 아침 해가 떳다.</title>

        <style>
            * {
                box-sizing: border-box;
            }

            body {
                margin: 0;
                background: #eeede9;
                color: #222724;
                font-family: system-ui, "Malgun Gothic", sans-serif;
                line-height: 1.85;
                word-break: keep-all;
                overflow-wrap: anywhere;
            }

            article {
                max-width: 820px;
                margin: clamp(12px, 5vw, 64px) auto;
                padding: clamp(20px, 6vw, 64px);
                border-top: 5px solid #252a27;
                background: #fffefa;
            }

            header {
                padding-bottom: 22px;
                border-bottom: 1px solid #d9d7d0;
            }

            .breaking {
                display: inline-block;
                padding: 3px 10px;
                background: #a52d22;
                color: white;
                font-size: 0.8125rem;
                font-weight: 700;
            }

            h1 {
                margin: 14px 0 10px;
                font-family: "Malgun Gothic", "Apple SD Gothic Neo", system-ui, sans-serif;
                font-size: clamp(2rem, 6vw, 3.5rem);
                font-weight: 600;
                line-height: 1.2;
                letter-spacing: -0.015em;
            }

            #date, #imgDes, .contact {
                color: #5c605a;
                font-size: 0.875rem;
            }

            #date {
                margin: 0;
            }

            #headline {
                margin: 26px 0;
                padding: 12px 16px;
                border-left: 3px solid #a52d22;
                background: #f6f2eb;
                font-weight: 650;
            }

            figure {
                margin: 0 0 28px;
            }

            figure img {
                display: block;
                width: 100%;
                height: auto;
                border-radius: 4px;
            }

            #imgDes {
                margin-top: 8px;
            }

            .story {
                margin: 0;
                font-size: 1.0625rem;
            }

            .contact {
                margin: 28px 0 0;
                padding-top: 14px;
                border-top: 1px solid #d9d7d0;
            }
        </style>
    </head>
    <body>
        <main>
            <article>
                <header>
                    <span class="breaking">속보</span>
                    <h1>오늘 아침 해가 떳다.</h1>
                    <p id="date">
                        기사 전송 : <time datetime="2026-11-16T13:05">2026-11-16 13:05</time>
                    </p>
                </header>

                <blockquote id="headline">
                    "해가 떠서 너무 놀라웠다."<br>
                    "어제도 떳는데 오늘도 뜰줄은 몰랐다."<br>
                    "달이 지고 해가 떳다"
                </blockquote>

                <figure>
                    <img alt="해뜨는 사진" width="400" src="https://cdn.pixabay.com/photo/2019/07/24/04/51/sunrise-4359203_1280.jpg">
                    <figcaption id="imgDes">오늘 아침 해가 떠오르고 있다. [사진 출처 : 인터넷]</figcaption>
                </figure>

                <p class="story">
                    <strong>김인규 기자</strong> = 오늘 아침 해가 떠서 논란이 되고 있다. 어제 밤까지만 해도 있던 달이 지고 해가 떳다.<br>
                    일각에서는 해가 압력을 동원해서 달을 지게 한게 아닌지 의구심을 갖고 있다고한다.<br>
                    이에 따라 당국에서는 불법성은 없었는지 철저히 조사할것 이라고 밝혔다.
                </p>
                <footer class="contact">master@marondal.com</footer>
            </article>
        </main>
    </body>
</html>
