<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>단위 변환기(Unit Converter)</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/script.js" defer></script>
</head>
<body>
  <main class="converter">
    <nav class="service-nav" aria-label="변환기 메뉴">
      <a href="index.html" aria-current="page">메인</a>
      <a href="length.html">길이 변환</a>
      <a href="weight.html">무게 변환</a>
    </nav>
    <header class="hero home-hero">
      <button class="theme-button" id="theme" type="button" aria-pressed="false">
        <span class="theme-icon" aria-hidden="true">☾</span> 다크 모드
      </button>
      <h1>단위 변환기<span class="english-title">(Unit Converter)</span></h1>
    </header>
    <div class="converter-cards">
      <a class="converter-card" href="length.html">
        <span class="icon-tile" aria-hidden="true"><span class="ruler"></span></span>
        <h2>길이 변환</h2>
        <p>미터, 인치, 마일 등 길이 단위를 변환합니다.</p>
      </a>
      <a class="converter-card" href="weight.html">
        <span class="icon-tile" aria-hidden="true"><span class="weight-icon"></span></span>
        <h2>무게 변환</h2>
        <p>그램, 파운드, 근 등 무게 단위를 변환합니다.</p>
      </a>
    </div>
  </main>
</body>
</html>
