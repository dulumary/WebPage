<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>가위바위보 게임</title>
  <link rel="stylesheet" href="./css/style.css">
  <link rel="stylesheet" href="./css/navigation.css">
  <script src="./js/script.js" defer></script>
</head>
<body>
  <main class="page">
    <nav class="home-nav" aria-label="페이지 이동">
      <a class="game-link" href="./index.html"><span class="home-icon" aria-hidden="true"></span>메인으로</a>
    </nav>
    <header class="intro">
      <h1>가위바위보 <span>게임</span></h1>
      <p>가위, 바위, 보 중 하나를 선택하고 컴퓨터와 대결해요!</p>
    </header>

    <div class="layout">
      <section class="panel game" aria-labelledby="game-title">
        <h2 id="game-title">무엇을 낼까요?</h2>
        <div class="choices">
          <button type="button" class="choice" data-choice="scissors"><img class="hand" src="./images/scissors.png" alt="">가위</button>
          <button type="button" class="choice" data-choice="rock"><img class="hand" src="./images/rock.png" alt="">바위</button>
          <button type="button" class="choice" data-choice="paper"><img class="hand" src="./images/paper.png" alt="">보</button>
        </div>

        <div class="game-status">
          <span class="status-icon" aria-hidden="true"><span>›ᴗ‹</span></span>
          <div class="speech">
            <p id="status" role="status">손 모양을 골라 게임을 시작해요!</p>
            <span class="thinking" aria-hidden="true"><i></i><i></i><i></i></span>
          </div>
        </div>

        <div class="match" aria-label="대결 결과">
          <strong id="result" hidden></strong>
          <div class="player">
            <h3>나의 선택</h3>
            <div class="move"><span id="user-icon" class="move-icon" aria-hidden="true">?</span><span id="user-choice" hidden></span></div>
          </div>
          <span id="versus" aria-hidden="true">VS</span>
          <div class="player">
            <h3>컴퓨터 선택</h3>
            <div class="move"><span id="computer-icon" class="move-icon" aria-hidden="true">?</span><span id="computer-choice" hidden></span></div>
          </div>
        </div>

      </section>

      <section class="panel records" aria-labelledby="record-title">
        <h2 id="record-title">나의 전적</h2>
        <dl class="stats">
          <div><dt><span aria-hidden="true">🎮</span>전체 게임</dt><dd id="total">0</dd></div>
          <div><dt><span aria-hidden="true">👑</span>나의 승리</dt><dd id="win">0</dd></div>
          <div><dt><span aria-hidden="true">🖥️</span>컴퓨터 승리</dt><dd id="loss">0</dd></div>
          <div><dt><span aria-hidden="true">🤝</span>무승부</dt><dd id="draw">0</dd></div>
          <div class="rate">
            <dt id="rate-title"><span aria-hidden="true">🎯</span>승률</dt>
            <dd><span id="rate">0.0%</span><progress id="rate-bar" max="100" value="0" aria-labelledby="rate-title"></progress></dd>
          </div>
          <div><dt><span aria-hidden="true">🔥</span>현재 연승</dt><dd id="current-streak">0</dd></div>
          <div><dt><span aria-hidden="true">🏆</span>최고 연승</dt><dd id="best-streak">0</dd></div>
        </dl>

        <button type="button" id="reset" class="reset"><span aria-hidden="true">↻</span> 기록 초기화</button>
      </section>
    </div>
  </main>
</body>
</html>
