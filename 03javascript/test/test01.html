<!DOCTYPE html>

<html>
    <head>
        <meta charset="utf-8">
        <title>예약하기</title>
    </head>
    <body>
        <h2>예약하기</h2>
        <input type="text" placeholder="예약자 이름" id="nameInput"> <br>
        <input type="text" placeholder="예약 인원" id="countInput"> <br>
        <input type="text" placeholder="예약 날짜 (2020-04-21)" id="dateInput"> <br>
        <button type="button" id="reserveBtn">예약하기</button>

        <script>
            // 예약 버튼 가져오기
            const reserveBtn = document.querySelector("#reserveBtn");

            // 예약 버튼에 클릭 이벤트 등록
            reserveBtn.addEventListener("click", () => {
                const nameInput = document.querySelector("#nameInput");
                const name = nameInput.value;
                
                const countInput = document.querySelector("#countInput");
                const count = countInput.value;

                const dateInput = document.querySelector("#dateInput");
                const date = dateInput.value;

                if(name == "") {
                    alert("예약자 이름을 입력하세요");
                    return;
                }

                if(count == "") {
                    alert("예약 인원을 입력하세요");
                    return;
                }

                if(date == "") {
                    alert("예약 날짜를 입력하세요");
                    return;
                }
                
                alert(name + "님, " + date + "에 " + count + "명의 예약이 접수되었습니다");
            });
        </script>
    </body>
</html>
