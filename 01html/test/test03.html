<!DOCTYPE html>

<html lang="ko">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>[일상] 서울숲 나들이 후기!</title>
        <style>
            * {
                box-sizing: border-box;
            }

            body {
                margin: 0;
                padding: clamp(16px, 5vw, 56px);
                background: #edf3e9;
                color: #293c30;
                font-family: system-ui, "Malgun Gothic", sans-serif;
                line-height: 1.8;
            }

            main {
                max-width: 740px;
                margin: 0 auto;
                padding: clamp(20px, 5vw, 48px);
                background: #fffefa;
                border: 1px solid #d6e2d3;
                border-radius: 20px;
                box-shadow: 0 12px 32px #23402d12;
            }

            h1 {
                margin: 0 0 12px;
                color: #204b34;
                font-size: clamp(1.65rem, 5vw, 2.5rem);
                line-height: 1.3;
                word-break: keep-all;
                overflow-wrap: anywhere;
            }

            p {
                margin: 0 0 18px;
            }

            .category {
                display: inline-block;
                margin: 0;
                padding: 3px 12px;
                border-radius: 100px;
                background: #e4efe1;
                color: #315840;
                font-size: 0.875rem;
            }

            hr {
                margin: 26px 0;
                border: 0;
                border-top: 1px solid #d6e2d3;
            }

            img {
                display: block;
                width: 100%;
                height: auto;
                margin-bottom: 22px;
                border-radius: 12px;
            }

            strong {
                color: #245b3c;
            }

            a {
                display: inline-block;
                padding: 9px 16px;
                border-radius: 8px;
                background: #28573d;
                color: #fff;
                font-weight: 600;
                text-decoration: none;
            }

            a:hover {
                background: #1c422e;
                text-decoration: underline;
            }

            a:focus-visible {
                outline: 2px solid #28573d;
                outline-offset: 4px;
            }

            .credit {
                margin: 20px 0 0;
                color: #52665a;
                font-size: 0.875rem;
            }
        </style>
    </head>
    <body>
        <main>
            <h1>[일상] 서울숲 나들이 후기!</h1>
            <p class="category">
                카테고리 : 일상 이야기
            </p> 
            <hr>
            <p>
                오늘은 서울숲에 다녀왔습니다!<br>
                날씨도 좋고 산책하기 딱 좋은 날이었어요 ^^
            </p>
            <img alt="서울숲 산책로" width="500" src="https://mediahub.seoul.go.kr/uploads/mediahub/2024/04/PjSIVqMEOCwmYrREpqQshhDkbXPMAeyG.jpg">

            <p>
                서울숲에는 멋진 산책로가 많았습니다. <br>
                특히 <strong>거울연못</strong>에 비친 풍경이 정말 예뻤어요!<br>
                도심 속에서 자연을 느낄 수 있어 좋았습니다.
            </p>
            <img alt="서울숲 꽃밭" width="500" src="https://mediahub.seoul.go.kr/uploads/mediahub/2024/04/HVtAsCkWHpVcucQNRbTbpYarQrHZsdCJ.jpg">
            <p>
                알록달록한 튤립도 구경했습니다. <br>
                다음에도 꼭 다시 방문하고 싶네요 ^^
            </p>
            <hr>
            <p>
                서울숲에 대해 더 알아보고 싶다면
            </p>
            <a target="_blank" href="https://parks.seoul.go.kr/park/detailView.do?pIdx=5">서울숲 공식 안내 페이지</a>

            <p class="credit">사진 출처 : 서울시 내 손안에 서울 (박우영)</p>
        </main>
    </body>
</html>
