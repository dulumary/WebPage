<!DOCTYPE html>

<html>
    <head>
        <title>다양한 태그</title>
    </head>
    <body>
        <h3>링크 태그</h3>

        <!-- 속성 -->
        <a href="https://naver.com" target="_blank">네이버로 이동</a>
        <br>
        <a href="ex01.html">예제1</a>

        <h3>이미지 태그</h3>
        <!-- width : 너비 height : 높이 -->
        <img alt="가을호수" width="200" src="https://images.unsplash.com/photo-1507371341162-763b5e419408?q=80&w=1039&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=NHwxMjA3fDA%3D">
        <br>
        <img alt="잠자는 고양이" width="200" src="images/cat.jpg">

        <h3>입력 태그</h3>
        <label>검색</label><input type="text">
        <h3>버튼</h3>
        <button type="button">입력</button>

        <h3>셀렉트 박스</h3>
        <select>
            <option>사과</option>
            <option>바나나</option>
        </select>

        <h3>체크박스</h3>
        <input type="checkbox"><label>동의</label>
        <input type="checkbox"><label>개인정보 처리 동의</label>

        <h3>텍스트 에어리어</h3>
        <textarea rows="10" cols="30"></textarea>

    </body>
</html>
